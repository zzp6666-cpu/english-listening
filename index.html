<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8a90a2;
    --line: #e7e9f0;
    --accent: #3b6ef5;
    --accent-soft: #eaf0ff;
    --done: #d8f5e3;
    --shadow: 0 6px 24px rgba(30,40,80,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 140px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px; box-shadow: var(--shadow);
  }

  /* 上传区 */
  #drop {
    border: 2px dashed var(--line); border-radius: 14px; padding: 36px 20px;
    text-align: center; cursor: pointer; transition: .2s; background: #fafbff;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop .big { font-size: 16px; font-weight: 600; }
  #drop .small { color: var(--muted); font-size: 13px; margin-top: 6px; }
  #fileInput { display: none; }

  .status { margin-top: 14px; font-size: 14px; color: var(--muted); min-height: 20px; }
  .err { color: #e0533d; }

  /* 控制条 */
  #player { display: none; margin-top: 22px; }
  .ctrl {
    position: sticky; top: 0; z-index: 5;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  button.btn {
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer;
    transition: .15s; display: inline-flex; align-items: center; gap: 6px;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.btn.primary:hover { filter: brightness(1.05); color:#fff; }
  button.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }
  select {
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
    font-size: 14px; background: #fff; color: var(--text);
  }
  .count { font-size: 13px; color: var(--muted); }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); cursor: pointer; user-select: none; }
  .chk input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .masked { color: var(--muted); font-size: 13px; font-style: italic; }

  /* 音频库 */
  #library { margin-top: 18px; }
  .lib-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .lib-title { font-size: 16px; font-weight: 600; }
  .lib-list { display: flex; flex-direction: column; gap: 8px; }
  .lib-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
  }
  .lib-item .lib-main { flex: 1; min-width: 0; }
  .lib-name { font-size: 15px; font-weight: 500; cursor: pointer; word-break: break-all; }
  .lib-name:hover { color: var(--accent); }
  .lib-name input {
    font-size: 15px; width: 100%; padding: 4px 8px;
    border: 1px solid var(--accent); border-radius: 8px; outline: none;
  }
  .lib-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .lib-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .lib-actions .btn { padding: 6px 10px; font-size: 13px; }

  /* 句子列表 */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .sent {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer; background: #fff; transition: .15s;
  }
  .sent:hover { border-color: var(--accent); background: #fbfcff; }
  .sent .idx {
    flex: 0 0 30px; height: 30px; border-radius: 8px; background: var(--bg);
    color: var(--muted); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }
  .sent .txt { flex: 1; font-size: 15px; }
  .sent .play { opacity: 0; color: var(--accent); font-size: 18px; }
  .sent:hover .play { opacity: .5; }
  .sent.current { border-color: var(--accent); background: var(--accent-soft); }
  .sent.current .idx { background: var(--accent); color: #fff; }
  .sent.done .idx { background: var(--done); color: #1f8a52; }
  .sent.current .play, .sent.done .play { opacity: .8; }

  .hint { color: var(--muted); font-size: 13px; margin-top: 16px; }
  .warn {
    display: none; background: #fff4e5; border: 1px solid #ffb74d; color: #8a5a00;
    border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; line-height: 1.7;
  }
  .warn b { color: #b35900; }

  /* 切片编辑器 */
  #editor { display: none; margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #fbfcff; }
  .edit-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .edit-head .et { font-weight: 600; font-size: 15px; }
  .edit-list { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow: auto; padding-right: 4px; }
  .edit-row { display: flex; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .edit-row .e-idx { flex: 0 0 26px; height: 26px; border-radius: 6px; background: var(--bg); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
  .edit-row .e-body { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .e-text { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 14px; resize: vertical; font-family: inherit; line-height: 1.5; }
  .e-mask { font-size: 13px; color: var(--muted); font-style: italic; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 8px; }
  .e-times { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .e-times label { display: inline-flex; align-items: center; gap: 4px; }
  .t-input { width: 72px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 13px; }
  .e-times .btn { padding: 5px 9px; font-size: 13px; }
  .e-merge { color: #b35900; }
  .edit-actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .edit-actions .tip { font-size: 12px; color: var(--muted); }
  audio { display: none; }
</style>
</head>

const OV_KEY = "el_static_overrides_v1";
let OV = { names: {}, deleted: [], segments: {} };
try { const _raw = localStorage.getItem(OV_KEY); if (_raw) OV = Object.assign(OV, JSON.parse(_raw)); } catch (e) {}
function saveOV() { try { localStorage.setItem(OV_KEY, JSON.stringify(OV)); } catch (e) {} }
function audioUrl(it) { return "uploads/" + (it.filepath || "").replace(/\\/g, "/").split("/").pop(); }

const $ = (s) => document.querySelector(s);
const drop = $("#drop"), fileInput = $("#fileInput"), statusEl = $("#status"), warnEl = $("#warn");
const player = $("#player"), listEl = $("#list"), audio = $("#audio");
const libraryEl = $("#library"), libListEl = $("#libList"), libCountEl = $("#libCount");
const playPauseBtn = $("#playPause"), prevBtn = $("#prev"), nextBtn = $("#next");
const autoBtn = $("#auto"), loopBtn = $("#loop"), speedSel = $("#speed"), countEl = $("#count");
const showTextEl = $("#showText"), editShowTextEl = $("#editShowText");
const editBtn = $("#editBtn"), editorEl = $("#editor"), editListEl = $("#editList");
const saveSegBtn = $("#saveSeg"), cancelSegBtn = $("#cancelSeg"), editCountEl = $("#editCount");

let sentences = [];
let current = -1;
let autoPlay = true;   // 连续播放（默认开）
let loopCurrent = false; // 单句循环（默认关）
let showText = false;  // 显示英文原文（默认隐藏，盲听模式）
let currentId = null;  // 当前音频在库中的 id
let currentWords = []; // 词级时间戳（用于拆分时按词归属文字）
let editing = false;
let editable = [];     // 编辑模式下的切片副本

// ---- 上传 ----
drop.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); });
["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) upload(f); });

function upload(file) {
  statusEl.className = "status";
  statusEl.textContent = "在线展示版不支持上传新音频。上传与自动转写请在本机运行完整版（启动.bat）。";
}

// 安全解析：后端必须返回 JSON，否则给出人话提示
async function safeJson(res) {
  const ct = res.headers.get("content-type") || "";
  const text = await res.text();
  if (!ct.includes("application/json") || !text.trim()) {
    throw new Error("无法连接后端服务。请确认：① 用的是 http://127.0.0.1:5000 这个地址（不是 static-html 静态预览）；② 服务已启动（双击 启动.bat）。");
  }
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error("后端返回了无法解析的内容，请查看服务端日志。");
  }
}

// 静态展示版：数据已内联，无需后端
function hideWarn() { warnEl.style.display = "none"; }
hideWarn();
loadLibrary();   // 打开页面即载入音频库

// ---- 渲染句子列表 ----
function renderList() {
  listEl.innerHTML = "";
  sentences.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "sent";
    row.dataset.i = i;
    const txt = showText
      ? escapeHtml(s.text)
      : `<span class="masked">第 ${i + 1} 句 · 点击播放（原文已隐藏）</span>`;
    row.innerHTML = `<div class="idx">${i + 1}</div>
      <div class="txt">${txt}</div>
      <div class="play">▶</div>`;
    row.addEventListener("click", () => playSentence(i));
    listEl.appendChild(row);
  });
  countEl.textContent = `共 ${sentences.length} 句`;
}

function escapeHtml(t) {
  return t.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

// ---- 音频库 ----
function loadLibrary() {
  const list = Object.keys(LIB)
    .filter(id => !OV.deleted.includes(id))
    .map(id => {
      const it = LIB[id];
      return {
        id: id,
        name: OV.names[id] || it.name,
        duration: it.duration || 0,
        count: (OV.segments[id] || it.sentences || []).length,
        created: it.created || ""
      };
    })
    .sort((a, b) => String(b.created).localeCompare(String(a.created)));
  renderLibrary(list);
}

function renderLibrary(list) {
  if (!list.length) { libraryEl.style.display = "none"; return; }
  libraryEl.style.display = "block";
  libCountEl.textContent = `共 ${list.length} 个`;
  libListEl.innerHTML = "";
  list.forEach(it => {
    const dur = (it.duration || 0).toFixed(1);
    const created = fmtTime(it.created);
    const row = document.createElement("div");
    row.className = "lib-item";
    row.dataset.id = it.id;
    row.innerHTML = `
      <div class="lib-main">
        <div class="lib-name" title="点击重命名">${escapeHtml(it.name)}</div>
        <div class="lib-meta">${dur}s · ${it.count} 句 · ${created}</div>
      </div>
      <div class="lib-actions">
        <button class="btn primary act-load">▶ 播放</button>
        <button class="btn act-rename">重命名</button>
        <button class="btn act-del">删除</button>
      </div>`;
    row.querySelector(".act-load").addEventListener("click", () => loadItem(it.id));
    row.querySelector(".act-rename").addEventListener("click", () => startRename(row, it.id, it.name));
    row.querySelector(".act-del").addEventListener("click", () => deleteItem(it.id, it.name, row));
    libListEl.appendChild(row);
  });
}

function fmtTime(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch (e) { return ""; }
}

function loadItem(id) {
  const it = LIB[id];
  if (!it) { statusEl.textContent = "未找到该音频"; return; }
  sentences = (OV.segments[id] || it.sentences || []).map(s => ({ text: s.text, start: s.start, end: s.end }));
  currentId = id;
  currentWords = it.words || [];
  audio.src = audioUrl(it);
  renderList();
  player.style.display = "block";
  statusEl.className = "status";
  statusEl.textContent = "";
  playSentence(0);
}

function startRename(row, id, oldName) {
  const nameEl = row.querySelector(".lib-name");
  const input = document.createElement("input");
  input.value = oldName;
  nameEl.innerHTML = "";
  nameEl.appendChild(input);
  input.focus();
  input.select();
  const commit = async () => {
    const v = input.value.trim();
    const newName = v || oldName;
    OV.names[id] = newName;
    saveOV();
    nameEl.textContent = newName;
  };
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") input.blur();
    else if (e.key === "Escape") { input.value = oldName; input.blur(); }
  });
}

function deleteItem(id, name, row) {
  if (!confirm(`确定从列表中移除「${name}」？仅影响当前浏览器。`)) return;
  if (!OV.deleted.includes(id)) OV.deleted.push(id);
  saveOV();
  row.remove();
  if (!libListEl.children.length) libraryEl.style.display = "none";
}

// ---- 播放控制 ----
function playSentence(i) {
  if (i < 0 || i >= sentences.length) return;
  current = i;
  highlight();
  audio.currentTime = sentences[i].start;
  audio.play().catch(()=>{});
  setPlayUI(true);
}

function highlight() {
  [...listEl.children].forEach((el, i) => {
    el.classList.toggle("current", i === current);
    if (i < current) el.classList.add("done");
    else el.classList.remove("done");
  });
  if (current >= 0) {
    const el = listEl.children[current];
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

audio.addEventListener("timeupdate", () => {
  if (current < 0) return;
  const end = sentences[current].end;
  if (audio.currentTime >= end - 0.03) {
    if (loopCurrent) {
      audio.currentTime = sentences[current].start;
      return;
    }
    audio.pause();
    if (autoPlay && current < sentences.length - 1) {
      playSentence(current + 1);
    } else {
      setPlayUI(false);
    }
  }
});
audio.addEventListener("ended", () => setPlayUI(false));

function setPlayUI(playing) {
  playPauseBtn.textContent = playing ? "⏸ 暂停" : "▶ 播放";
  playPauseBtn.classList.toggle("primary", !playing ? false : true);
}

playPauseBtn.addEventListener("click", () => {
  if (!sentences.length) return;
  if (audio.paused) {
    // 若已播完，从头开始
    if (current < 0 || audio.currentTime >= sentences[current].end - 0.03) {
      playSentence(Math.max(0, current < 0 ? 0 : (current >= sentences.length - 1 ? 0 : current)));
    } else {
      audio.play().catch(()=>{});
      setPlayUI(true);
    }
  } else {
    audio.pause();
    setPlayUI(false);
  }
});

prevBtn.addEventListener("click", () => { if (current > 0) playSentence(current - 1); });
nextBtn.addEventListener("click", () => { if (current < sentences.length - 1) playSentence(current + 1); });

autoBtn.addEventListener("click", () => {
  autoPlay = !autoPlay;
  autoBtn.classList.toggle("on", autoPlay);
});
loopBtn.addEventListener("click", () => {
  loopCurrent = !loopCurrent;
  loopBtn.classList.toggle("on", loopCurrent);
});
speedSel.addEventListener("change", () => { audio.playbackRate = parseFloat(speedSel.value); });

// 主列表与编辑切片面板共用同一个「显示原文」状态，两处开关联动
function setShowText(v) {
  showText = !!v;
  showTextEl.checked = showText;
  editShowTextEl.checked = showText;
  renderList();
  if (editing) renderEditor();
}
showTextEl.addEventListener("change", () => setShowText(showTextEl.checked));
editShowTextEl.addEventListener("change", () => setShowText(editShowTextEl.checked));

// ---- 切片编辑器（手动微调） ----
function fmtClock(sec) {
  if (isNaN(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ":" + s.toFixed(1).padStart(4, "0");
}
function parseClock(str) {
  str = (str || "").trim();
  if (!str) return NaN;
  if (str.includes(":")) {
    const [m, s] = str.split(":");
    return parseFloat(m) * 60 + parseFloat(s);
  }
  return parseFloat(str);
}

editBtn.addEventListener("click", () => {
  if (!sentences.length) return;
  editing = !editing;
  if (editing) {
    editable = sentences.map(s => ({ text: s.text, start: s.start, end: s.end }));
    editShowTextEl.checked = showText;   // 进入编辑面板时同步开关状态
    renderEditor();
    editorEl.style.display = "block";
    listEl.style.display = "none";
    editBtn.textContent = "✓ 完成";
    editBtn.classList.add("on");
  } else {
    editorEl.style.display = "none";
    listEl.style.display = "flex";
    editBtn.textContent = "✂ 编辑切片";
    editBtn.classList.remove("on");
  }
});

function renderEditor() {
  editListEl.innerHTML = "";
  editCountEl.textContent = `共 ${editable.length} 段`;
  editable.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "edit-row";
    // 盲听模式下不显示原文（与主列表的「显示原文」开关联动）；
    // 需要改文字时勾选开关，文字框才会出现。
    const textRow = showText
      ? `<textarea class="e-text" rows="1">${escapeHtml(s.text)}</textarea>`
      : `<div class="e-mask">第 ${i + 1} 段 · 原文已隐藏</div>`;
    row.innerHTML = `
      <div class="e-idx">${i + 1}</div>
      <div class="e-body">
        ${textRow}
        <div class="e-times">
          <label>起 <input class="e-start t-input" type="text" value="${fmtClock(s.start)}"></label>
          <label>止 <input class="e-end t-input" type="text" value="${fmtClock(s.end)}"></label>
          <button class="btn e-split">在播放处切</button>
          ${i > 0 ? '<button class="btn e-merge">合并↑</button>' : ""}
          <button class="btn e-del">删除</button>
        </div>
      </div>`;
    const textEl = row.querySelector(".e-text");
    if (textEl) textEl.addEventListener("input", () => { editable[i].text = textEl.value; });
    const startEl = row.querySelector(".e-start");
    startEl.addEventListener("change", () => {
      const v = parseClock(startEl.value);
      if (!isNaN(v)) editable[i].start = v;
      startEl.value = fmtClock(editable[i].start);
    });
    const endEl = row.querySelector(".e-end");
    endEl.addEventListener("change", () => {
      const v = parseClock(endEl.value);
      if (!isNaN(v)) editable[i].end = v;
      endEl.value = fmtClock(editable[i].end);
    });
    row.querySelector(".e-split").addEventListener("click", () => splitAt(i));
    if (i > 0) row.querySelector(".e-merge").addEventListener("click", () => mergeUp(i));
    row.querySelector(".e-del").addEventListener("click", () => delSeg(i));
    editListEl.appendChild(row);
  });
}

// 在当前播放位置把第 i 段切成两段，文字按词级时间戳归属
function splitAt(i) {
  const seg = editable[i];
  const t = audio.currentTime;
  // 守卫：切点必须落在该段内部，且与两端保持 0.1s 以上，避免产生极短/空段
  if (t <= seg.start + 0.1 || t >= seg.end - 0.1) {
    alert(`切点要在第 ${i + 1} 段内部（当前播放位置不在此段，或太靠近边界）。请先播放并定位到该段中间。`);
    return;
  }
  const wrds = currentWords || [];
  // 只取落在该段时间范围内的词（留 0.05s 容差，吸收 VAD 造成的边界抖动）
  const inRange = wrds.filter(w => w[1] >= seg.start - 0.05 && w[2] <= seg.end + 0.05);
  let left = [], right = [];
  // 按「词的中心」归属：中心在切点之前的归左，之后的归右（每个词只归一侧，不丢失）
  for (const w of inRange) {
    const wc = (w[1] + w[2]) / 2;
    if (wc <= t) left.push(w[0]); else right.push(w[0]);
  }
  // 兜底：避免任一侧为空（切点落在首词之前或尾词之后时，把边界词补到另一侧）
  if (!left.length && right.length) left.push(right.shift());
  if (!right.length && left.length) right.push(left.pop());

  let leftText, rightText;
  if (left.length && right.length) {
    leftText = left.join(" ");
    rightText = right.join(" ");
  } else {
    // 词级数据缺失或无法二分：左段保留原文，右段留空，提示用户手动补
    leftText = seg.text;
    rightText = "";
  }
  const leftSeg = { text: leftText, start: seg.start, end: round3(t) };
  const rightSeg = { text: rightText, start: round3(t), end: seg.end };
  editable.splice(i, 1, leftSeg, rightSeg);
  audio.currentTime = t;
  renderEditor();
}

function mergeUp(i) {
  if (i <= 0) return;
  const prev = editable[i - 1], cur = editable[i];
  prev.end = cur.end;
  prev.text = (prev.text + " " + cur.text).replace(/\s+/g, " ").trim();
  editable.splice(i, 1);
  renderEditor();
}

function delSeg(i) {
  editable.splice(i, 1);
  renderEditor();
}

function round3(x) { return Math.round(x * 1000) / 1000; }

saveSegBtn.addEventListener("click", async () => {
  if (!currentId) { alert("请先上传或载入一个音频再保存切片。"); return; }
  // 规范化：排序 + 去重叠
  const norm = editable.map(s => ({ text: s.text, start: s.start, end: s.end }))
    .sort((a, b) => a.start - b.start);
  for (let i = 1; i < norm.length; i++) {
    if (norm[i].start < norm[i - 1].end) norm[i].start = norm[i - 1].end;
  }
  OV.segments[currentId] = norm;
  saveOV();
  sentences = norm;
  renderList();
  loadLibrary();
  editing = false;
  editorEl.style.display = "none";
  listEl.style.display = "flex";
  editBtn.textContent = "✂ 编辑切片";
  editBtn.classList.remove("on");
  statusEl.className = "status";
  statusEl.textContent = "切片已保存在当前浏览器";
});

cancelSegBtn.addEventListener("click", () => {
  editing = false;
  editorEl.style.display = "none";
  listEl.style.display = "flex";
  editBtn.textContent = "✂ 编辑切片";
  editBtn.classList.remove("on");
});
</script>
